[package]
name = "farsight-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12.1"
farsight-proto = { version = "0.1.0", path = "../proto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
reed-solomon-simd = "3.1.0"
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
