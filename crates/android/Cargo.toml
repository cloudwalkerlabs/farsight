[package]
name = "farsight-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "farsight_android"
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
farsight-client = { version = "0.1.0", path = "../client" }
farsight-net = { version = "0.1.0", path = "../net" }
farsight-proto = { version = "0.1.0", path = "../proto" }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
uniffi = "0.32.2"

[target.'cfg(target_os = "android")'.dependencies]
farsight-tiles = { version = "0.1.0", path = "../tiles" }
jni-sys = "0.3"
libc = "0.2"
ndk = { version = "0.9", default-features = false, features = ["audio", "nativewindow", "api-level-30"] }
ndk-sys = { version = "0.6", features = ["media"] }
paranoid-android = "0.2.2"
rtrb = "0.3"
