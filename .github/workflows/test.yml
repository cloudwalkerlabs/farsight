name: test

on:
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (linux x86_64)
    runs-on: ubuntu-latest
    # Arch has the FFmpeg, PipeWire and Wayland the crates build against.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup clang cmake nasm pkgconf \
            ffmpeg libva pipewire wayland libxkbcommon mesa libglvnd alsa-lib
          rustup default stable
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
