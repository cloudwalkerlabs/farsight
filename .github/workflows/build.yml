name: build

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  linux:
    name: Linux x86_64 (server and desktop client)
    runs-on: ubuntu-latest
    # Arch has the FFmpeg, PipeWire and Wayland the crates build against.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup clang cmake nasm pkgconf \
            ffmpeg libva libjpeg-turbo opus pipewire wayland libxkbcommon mesa libglvnd alsa-lib
          rustup default stable
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p farsight-server -p farsight-desktop
      - name: Package
        run: |
          mkdir -p out/farsight
          cp target/release/farsight-server target/release/farsight-desktop README.md dist/farsight-server@.service out/farsight/
          tar -C out -czf farsight-linux-x86_64.tar.gz farsight
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: farsight-linux-x86_64.tar.gz

  macos:
    name: macOS arm64 (desktop client)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install ffmpeg pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p farsight-desktop
      - name: Package
        run: |
          mkdir -p out/farsight
          cp target/release/farsight-desktop README.md out/farsight/
          tar -C out -czf farsight-desktop-macos-arm64.tar.gz farsight
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: farsight-desktop-macos-arm64.tar.gz

  windows:
    name: Windows x86_64 (desktop client)
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v5
      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $name = "ffmpeg-n9.0-latest-win64-lgpl-shared-9.0"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          Rename-Item $name ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p farsight-desktop
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out/farsight | Out-Null
          Copy-Item target/release/farsight-desktop.exe, README.md out/farsight/
          Copy-Item ffmpeg/bin/*.dll out/farsight/
          Compress-Archive out/farsight farsight-desktop-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: farsight-desktop-windows-x86_64.zip

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../farsight-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: farsight-android.apk

  release:
    name: Upload to the release
    if: github.event_name == 'release'
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber -R "${{ github.repository }}"
