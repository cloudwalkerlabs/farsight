name: build

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  linux:
    name: Linux x86_64 (server and desktop client)
    runs-on: ubuntu-latest
    # Debian 12's glibc (2.36): the binaries run on distributions as old.
    container: debian:12
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates xz-utils \
            clang libclang-dev cmake nasm pkg-config bison python3-venv \
            libva-dev libdrm-dev libpipewire-0.3-dev libwayland-dev libgbm-dev libegl-dev libasound2-dev
          # Debian's meson is too old for libxkbcommon.
          python3 -m venv /opt/meson
          /opt/meson/bin/pip install meson ninja
          echo /opt/meson/bin >> "$GITHUB_PATH"
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-linux-debian12-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/ffmpeg/build.sh ffmpeg-prefix
      # ffmpeg-sys-next's rlib bundles FFmpeg's static libraries, so a
      # new FFmpeg needs a fresh one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian12-ffmpeg-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - run: cargo build --release --locked -p farsight-server -p farsight-desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-prefix/lib/pkgconfig
      # Everything else is built in or loaded when used.
      - name: Check linkage
        run: |
          cd target/release
          readelf -d farsight-server farsight-desktop | grep -E '^File|NEEDED'
          # (`! cmd` alone wouldn't fail the step: -e ignores it.)
          if readelf -d farsight-server farsight-desktop | grep NEEDED |
            grep -vE '\[(lib(c|m|gcc_s|pipewire-0\.3|gbm|asound)\.so\.[0-9]+|ld-linux-x86-64\.so\.2)\]'; then exit 1; fi
          echo "glibc: $(objdump -T farsight-server farsight-desktop | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1)"
          ./farsight-server --help > /dev/null
          ./farsight-desktop --help > /dev/null
      - name: Package
        run: |
          mkdir -p out/farsight
          cp target/release/farsight-server target/release/farsight-desktop README.md dist/farsight-server@.service out/farsight/
          cp ffmpeg-prefix/notice/* out/farsight/
          tar -C out -czf farsight-linux-x86_64.tar.gz farsight
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: farsight-linux-x86_64.tar.gz

  macos:
    name: macOS arm64 (desktop client)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install pkgconf meson ninja
      - id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-macos-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/ffmpeg/build.sh ffmpeg-prefix
      - uses: dtolnay/rust-toolchain@stable
      # ffmpeg-sys-next's rlib bundles FFmpeg's static libraries, so a
      # new FFmpeg needs a fresh one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - run: cargo build --release --locked -p farsight-desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-prefix/lib/pkgconfig
      - name: Check linkage
        run: |
          otool -L target/release/farsight-desktop
          if otool -L target/release/farsight-desktop | tail -n +2 | grep -vE '^\s+(/System/Library/|/usr/lib/)'; then exit 1; fi
          target/release/farsight-desktop --help > /dev/null
      - name: Package
        run: |
          mkdir -p out/farsight
          cp target/release/farsight-desktop README.md out/farsight/
          cp ffmpeg-prefix/notice/* out/farsight/
          tar -C out -czf farsight-desktop-macos-arm64.tar.gz farsight
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: farsight-desktop-macos-arm64.tar.gz

  windows:
    name: Windows x86_64 (desktop client)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      # FFmpeg's configure needs a Unix shell; it and meson build with MSVC
      # from it. The MinGW pkgconf takes the Windows paths cargo hands it.
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils nasm tar xz mingw-w64-x86_64-pkgconf
      - id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-windows-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: pip install meson ninja
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils link.exe would shadow MSVC's linker.
          rm -f /usr/bin/link.exe
          tools/ffmpeg/build.sh ffmpeg-prefix
      - uses: dtolnay/rust-toolchain@stable
      # ffmpeg-sys-next's rlib bundles FFmpeg's static libraries, so a
      # new FFmpeg needs a fresh one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - run: cargo build --release --locked -p farsight-desktop
        env:
          PKG_CONFIG: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\pkgconf.exe
          PKG_CONFIG_PATH: ${{ github.workspace }}\ffmpeg-prefix\lib\pkgconfig
      - name: Check linkage
        shell: pwsh
        run: |
          $deps = dumpbin /dependents target/release/farsight-desktop.exe
          $deps
          if ($deps -match 'av(codec|util)|dav1d') { throw "FFmpeg is linked dynamically" }
          target/release/farsight-desktop.exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out/farsight | Out-Null
          Copy-Item target/release/farsight-desktop.exe, README.md out/farsight/
          Copy-Item ffmpeg-prefix/notice/* out/farsight/
          Compress-Archive out/farsight farsight-desktop-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: farsight-desktop-windows-x86_64.zip

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../farsight-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: farsight-android.apk

  release:
    name: Upload to the release
    if: github.event_name == 'release'
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber -R "${{ github.repository }}"
